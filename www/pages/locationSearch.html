<script>
    document.addEventListener("deviceready", onDeviceReady, false);

        function onDeviceReady() {
            checkAndRequestPermission();
        }
        function checkAndRequestPermission() {
            cordova.plugins.diagnostic.requestLocationAuthorization(function (status) {
                if (
                    status === cordova.plugins.diagnostic.permissionStatus.GRANTED ||
                    status === cordova.plugins.diagnostic.permissionStatus.GRANTED_WHEN_IN_USE
                ) {
                    checkGPSOn();
                } else {
                    alert("Location permission not granted. Please allow it to proceed.");
                }
            }, function (error) {
                console.error("Location authorization request failed: " + error);
            }, cordova.plugins.diagnostic.locationAuthorizationMode.ALWAYS);
        }

        function checkGPSOn() {
            cordova.plugins.diagnostic.isGpsLocationAvailable(function (available) {
                if (available) {
                     
                } else {
                    alert("GPS is OFF. Please enable GPS to continue.");

                    // Try to open location settings
                    cordova.plugins.diagnostic.switchToLocationSettings(function () {
                        console.log("Opened location settings successfully");
                    }, function (error) {
                        console.error("Could not open location settings: " + error);

                        // Fallback to open general settings
                        cordova.plugins.diagnostic.switchToSettings(function () {
                            console.log("Opened general settings as fallback.");
                        }, function (fallbackError) {
                            console.error("Could not open any settings: " + fallbackError);
                        });
                    });

                    // Retry GPS status after delay
                    setTimeout(() => {
                        checkGPSOn();
                    }, 4000);
                }
            }, function (error) {
                console.error("GPS availability check failed: " + error);
            });
        }
    //   localStorage.setItem("currentCategoryName", "Grocery");
        document.addEventListener("DOMContentLoaded", async function () {
            const { branchId, address } = await getCurrentBranch();
            // console.log(address.address?.city_district, address?.address?.state);
           

            console.log(branchId, address);
            
            setTimeout(() => {
                
            
            if (address) {
                
                if (branchId.status == "success") {
                    location.replace("home.html");
                }
                else {
                    location.href = "branchNotFound.html";
                     let currentAddress = address.address?.city_district +' '+ address?.address?.state;
                     localStorage.setItem("currentLocation",currentAddress)
                }
            }
            else {
                console.log("address not found !")
            }
        }, 1500);
        });
